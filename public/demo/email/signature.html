<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Firma de mail de ejemplo</title></head>
<body style="margin:24px;font-family:Arial,Helvetica,sans-serif;background:#f6f5f3;">
  <p style="margin:0 0 16px 0;font-size:14px;color:#5b6170;">Firma recreada con datos ficticios. Una sola tabla, estilos inline, sin imágenes obligatorias.</p>
  <!-- Los estilos comunes se declaran una vez por celda (no se duplican entre firmas): en un sistema real, se genera desde una plantilla con variables. -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border:1px solid #d9d7d2;border-radius:10px;">
    <tr>
      <td style="padding:16px 20px;border-right:3px solid #c2410c;vertical-align:top;font-size:18px;font-weight:800;letter-spacing:-0.02em;color:#1b1f2a;">Relevo</td>
      <td style="padding:16px 20px;font-size:14px;line-height:21px;color:#1b1f2a;">
        <strong style="font-size:15px;">Nombre Apellido</strong><br>
        <span style="color:#5b6170;">Cargo de ejemplo</span><br>
        <a href="mailto:nombre@example.com" style="color:#1f5fbf;">nombre@example.com</a> · <a href="https://example.com" style="color:#1f5fbf;">example.com</a>
      </td>
    </tr>
  </table>
</body>
</html>
