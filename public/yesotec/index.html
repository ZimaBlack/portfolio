<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Demo · Sistema de gestión de inventario y presupuestos</title>
  <meta name="description" content="Demo interactiva, con datos de ejemplo, de un sistema de gestión de inventario, presupuestos, pedidos y remitos.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 22V10h5a4 4 0 010 8h-2' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="demo-bar">
    <button class="menu-btn" id="menu" aria-label="Menú">☰</button>
    <span><b>Demo interactiva</b> · datos de ejemplo, nada se envía a ningún servidor</span>
    <span class="sp"></span>
    <label>Ver como
      <select id="rol" aria-label="Ver como">
        <option value="admin">Administrador</option>
        <option value="ventas">Ventas</option>
        <option value="deposito">Depósito</option>
      </select>
    </label>
    <button id="tema" title="Cambiar tema">Tema</button>
    <button id="reset" title="Vuelve a los datos originales">Reiniciar demo</button>
  </div>
  <div class="app">
    <nav class="side" id="side" aria-label="Menú principal"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast hide" role="status"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
