<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dados">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Dados</title>
<style>
  *{border-radius:0!important}
  @font-face{font-family:RogueBit;src:url(fonts/roguebit.ttf) format('truetype');font-display:swap}
  :root{--bg:#111;--panel:#1c1c1c;--line:#444;--dim:#999;--text:#f2f2f2;--accent:#f0b429;--bad:#e5534b;--good:#57ab5a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  body{font:16px/1.5 RogueBit,ui-monospace,monospace;-webkit-font-smoothing:none;letter-spacing:.02em}
  #app{max-width:480px;height:100dvh;margin:0 auto;padding:env(safe-area-inset-top) 14px 0;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:16px}
  .lives{letter-spacing:.15em;color:#e5534b}.lives .off{color:#444}
  main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
  footer{padding:10px 0 calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  h1{margin:0;font-size:24px}.dim{color:var(--dim)}
  button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:54px;padding:0 16px;cursor:pointer}
  button:active:not(:disabled){transform:scale(.98)}button:disabled{opacity:.35}
  button.primary{background:var(--text);color:#111;border-color:var(--text);font-weight:700}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .goal{display:flex;gap:28px;justify-content:center}.goal div{display:flex;flex-direction:column}
  .goal small{color:var(--dim);font-size:16px;text-transform:uppercase;letter-spacing:.08em}
  .goal b{font-size:48px;line-height:1}.goal .t{color:var(--accent)}
  .bad b.s{color:var(--bad)}.ok b.s{color:var(--good)}
  .msg{min-height:1.4em}.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
  .skills{display:flex;gap:8px;overflow-x:auto}
  .skills button{flex:none;min-height:50px;font-size:16px}.skills button.sel{border-color:var(--accent);color:var(--accent)}
  .skills button.can{border-color:var(--good);color:var(--good)}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .stepper button{border:0;background:transparent;width:48px;font-size:24px}.stepper b{width:28px;font-size:24px}
  header{gap:10px}header>span:first-child{flex:1}
  .help-btn{min-height:34px;width:34px;padding:0;font-weight:700;flex:none}
  #app.busy footer{opacity:.5;pointer-events:none}
  /* rodillos pixel-art */
  .slot{flex:1;min-height:124px;width:100%;display:flex;align-items:center;justify-content:center}
  .reels{display:flex;gap:6px;justify-content:center}
  .reel{position:relative;width:58px;height:120px;overflow:hidden;background:#cfcfcf;border:4px solid #0d0d0d;box-shadow:inset 0 0 0 2px #7a7a7a;flex:none;padding:0;min-height:0;font:inherit;color:inherit;display:block}
  .reel:disabled{opacity:1}
  .reel.wide{width:76px}
  .reel .strip{display:flex;flex-direction:column}
  .reel b{flex:none;height:40px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:1px 0 0 2px;letter-spacing:0;font-size:32px;line-height:1;color:#161616}
  /* arriba y abajo quedan en sombra; el centro, iluminado: la casilla que vale */
  .reel::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0008 0 40px,transparent 40px 80px,#0008 80px);box-shadow:inset 0 3px 0 #0006,inset 0 -3px 0 #0006}
  /* rayas de velocidad: franjas horizontales de píxeles que cruzan el rodillo mientras gira rápido */
  .reel::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:repeating-linear-gradient(to bottom,#ffffff99 0 2px,transparent 2px 10px),repeating-linear-gradient(to bottom,transparent 0 5px,#0000008c 5px 7px,transparent 7px 10px)}
  .reel.spin::before{animation:reelstreak 1.5s var(--d) steps(1,end) both,reelstreakmove .12s var(--d) steps(5,end) 12}
  @keyframes reelstreak{0%,10%{opacity:0}14%,62%{opacity:1}78%{opacity:.5}88%,100%{opacity:0}}
  @keyframes reelstreakmove{from{background-position:0 0,0 0}to{background-position:0 50px,0 50px}}
  .reel.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px #fff6,0 0 0 2px #f2b63255}
  .reel.armed{opacity:.6}.reel.off{opacity:.22}
  .reel.pick{border-color:#fff;animation:reelpick .6s steps(2,end) infinite;opacity:1}
  .reel.nope{opacity:.45}
  @keyframes reelpick{50%{box-shadow:0 0 0 3px #f2b632}}
  /* giro fluido: un tironcito hacia atrás, arranque veloz y desenfocado, frenada larga y suave, y un rebote corto al caer. Cada rodillo sale un poco después. */
  .reel.spin{--d:calc(var(--i) * .09s);animation:reelland .4s calc(var(--d) + 1.45s) ease-out both}
  .reel.spin .strip{animation:reelrun 1.5s var(--d) both;will-change:transform}
  @keyframes reelrun{
    0%{transform:translateY(0);animation-timing-function:ease-out}
    10%{transform:translateY(10px);animation-timing-function:cubic-bezier(.5,.02,.12,1)}
    88%{transform:translateY(-568px);animation-timing-function:ease-in-out}
    100%{transform:translateY(-560px)}}
  @keyframes reelland{0%{transform:translateY(0);filter:brightness(1.8)}30%{transform:translateY(3px);filter:brightness(1.4)}60%{transform:translateY(-2px);filter:brightness(1.15)}100%{transform:none;filter:none}}
  @media (prefers-reduced-motion:reduce){.reel.spin,.reel.spin .strip{animation:none}.reel.spin .strip{transform:translateY(-560px)}}
  .gamefoot{min-height:206px;justify-content:flex-end}
  .die{flex:0 1 44px;min-width:26px;width:44px;height:44px;border-radius:10px;font-size:24px;font-weight:700;border:2px solid var(--text);background:var(--panel);padding:0;min-height:0}
  .die:disabled{opacity:1}.die.pick{border-color:var(--accent);box-shadow:0 0 0 3px rgba(240,180,41,.3)}
  .goal{flex-direction:column!important;gap:4px!important}.goal b{font-size:32px!important}
  /* una casilla de suma por cada tirada disponible */
  .lots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
  .lot{background:#2d2d2d;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
  .lot small{font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .lot b{font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
  .lot.todo b{color:#bdbdbd}.lot.done b{color:#fff}.lot.last{background:#3b3526}.lot.last b{color:var(--accent)}
  .lot[data-act]{cursor:pointer}.lot.view{outline:0;background:#4a4a4a}.lot.has{background:#4a3f1c}
  .lot.pop{animation:lotpop .45s ease-out}
  @keyframes lotpop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  /* barra de la meta */
  .meter{width:100%;padding:0 4px}
  /* barra pixel-art: celdas cuadradas y animaciones por pasos */
  .track{position:relative;height:24px;background:repeating-linear-gradient(90deg,#2a2a2a 0 8px,transparent 8px 10px);overflow:hidden}
  .track i{position:absolute;top:0;bottom:0;-webkit-mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px);mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px)}
  .track .zone{background:rgba(87,171,90,.55)}
  .track .over{background:repeating-linear-gradient(135deg,rgba(229,83,75,.6) 0 4px,rgba(229,83,75,.3) 4px 8px)}
  .track .fill{left:0;--fc:#d8d8d8;background:var(--fc)}
  .track .fill.in{--fc:var(--good)}.track .fill.bust{--fc:var(--bad)}
  .track .fill.grow{animation:grow .7s steps(12,end)}
  /* te pasaste y ya no hay remedio: titila por pasos en rojo y se vacía celda a celda */
  .track .fill.lost{animation:blinkr .6s .7s steps(2,end) 3 both,drain 1s 2.5s steps(14,end) forwards}
  .track .fill.lost.grow{animation:grow .7s steps(12,end),blinkr .6s .7s steps(2,end) 3 both,drain 1s 2.5s steps(14,end) forwards}
  .track .fill.empty{width:0!important}
  /* te pasaste pero aún puedes salvarte: titila un par de veces y se queda llena */
  .track .fill.bust.grow:not(.lost){animation:grow .7s steps(12,end),blinkr .6s .7s steps(2,end) 2 both}
  @keyframes grow{from{width:var(--from)}}
  @keyframes blinkr{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}
  @keyframes drain{to{width:0}}
  @media (prefers-reduced-motion:reduce){.track .fill{animation:none!important}}
  .msg.late{animation:msgin .01s .9s both}
  @keyframes msgin{from{opacity:0}to{opacity:1}}
  .track .goalline{width:4px;margin-left:-4px;background:var(--accent);-webkit-mask:none;mask:none}
  .ticks{position:relative;height:18px;margin-top:2px;font-size:16px;line-height:1;color:var(--dim)}
  .ticks span{position:absolute;transform:translateX(-50%)}
  .ticks .z{color:#4a7a4e}.ticks .g{color:var(--accent)}
  /* cabecera: vidas y oro; cofres de la ronda */
  .hud{display:flex;align-items:center;gap:14px}
  .gold{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:16px;letter-spacing:0}
  .gold .coin{width:21px;height:21px;display:block;flex:none}
  .gold{white-space:nowrap}.gold .cost{color:var(--dim);font-size:16px}
  .prizebtn.got{border-color:var(--accent)}
  .chests{display:flex;align-items:center;gap:5px}
  .chests small{color:var(--dim);font-size:16px;letter-spacing:.14em;margin-right:4px}
  .chests i{width:14px;height:14px;background:#2c2c2c;box-shadow:inset 0 0 0 2px #1a1a1a}
  .chests i.on{background:#d9d9d9}.chests i.now{background:#6a6a6a}
  .chests.many{gap:3px}.chests.many i{width:10px;height:10px}.chests.many small{display:none}
  .round{color:var(--dim);font-size:16px}
  /* cofre pixel-art: aparece, se abre con destello o se carboniza y desaparece (todo por pasos) */
  .chestbox{position:relative;width:126px;height:117px;flex:none;margin:4px 0}
  .chestbox .chest{width:100%;height:100%;display:block}
  .chestbox.closed.play{animation:appear .5s steps(5,end)}
  .chestbox.maw.play .chest{animation:chomp .7s steps(1,end) 2}
  @keyframes chomp{0%{transform:scale(1,.82)}25%{transform:scale(1.08,1.12)}50%{transform:scale(1,.88)}75%{transform:scale(1.08,1.12)}100%{transform:none}}
  .chestbox.gold .chest{filter:drop-shadow(0 0 6px #f2b632aa)}
  .chestbox.gold.open.play .chest{animation:flash .9s steps(6,end)}
  @keyframes appear{from{transform:translateY(-56px);opacity:0}to{transform:none;opacity:1}}
  .chestbox.open.play .chest{animation:flash .9s steps(6,end)}
  @keyframes flash{0%{filter:brightness(1)}20%{filter:brightness(4)}40%{filter:brightness(1.2)}60%{filter:brightness(3)}100%{filter:brightness(1)}}
  .chestbox .sp{position:absolute;width:9px;height:9px;background:#fff7b0;opacity:0}
  .chestbox.open.play .sp{animation:spark .9s steps(5,end)}
  .sp.s1{left:-9px;top:10px}.sp.s2{right:-9px;top:0}.sp.s3{left:12px;top:-12px;animation-delay:.1s!important}.sp.s4{right:15px;top:-15px;animation-delay:.2s!important}
  @keyframes spark{0%{opacity:1;transform:scale(.5)}60%{opacity:1;transform:translateY(-10px) scale(1.4)}100%{opacity:0;transform:translateY(-16px) scale(.5)}}
  .chestbox.burn.play .chest{animation:burn .8s steps(6,end) forwards,vanish .6s .9s steps(6,end) forwards}
  .chestbox.burn.still{visibility:hidden}
  @keyframes burn{0%{filter:none}25%{filter:sepia(1) saturate(5) hue-rotate(-25deg)}50%{filter:sepia(1) saturate(3) brightness(.5)}100%{filter:grayscale(1) brightness(.12)}}
  @keyframes vanish{to{clip-path:inset(100% 0 0 0);opacity:0}}
  .chestbox .em{position:absolute;bottom:30px;width:9px;height:9px;background:#ff7a1a;opacity:0}
  .chestbox.burn.play .em{animation:ember .8s steps(5,end) infinite}
  .em.e1{left:18px}.em.e2{left:45px;animation-delay:.15s!important;background:#ffb43a}.em.e3{left:72px;animation-delay:.3s!important}
  @keyframes ember{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
  @media (prefers-reduced-motion:reduce){.chestbox *{animation:none!important}}
  /* tour guiado */
  #install{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#1d1d1d;border:2px solid var(--accent);padding:12px;font-size:16px}
  #install span{flex:1 1 100%;color:var(--dim)}#install button{margin-left:auto}
  #tour{position:fixed;inset:0;z-index:50}
  #tour .spot{position:fixed;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.78)}
  #tour .tip{position:fixed;left:14px;right:14px;max-width:452px;margin:0 auto;background:#1c1c1c;border:2px solid var(--accent);padding:12px 14px}
  #tour .tip b{color:var(--accent);font-size:16px}#tour .tip p{margin:6px 0 10px}
  .tipbtns{display:flex;gap:8px;align-items:center}.tipbtns .dim{flex:1}.tipbtns button{min-height:40px}

  .roundinfo{display:flex;gap:34px;justify-content:center}
  .roundinfo div{display:flex;flex-direction:column;align-items:center}
  .roundinfo b{font-size:32px;line-height:1;color:var(--accent)}.roundinfo small{color:var(--dim);font-size:16px;letter-spacing:.08em;text-transform:uppercase}
  main p.good{color:var(--good)}main p.bad{color:var(--bad)}
  /* premios y tienda */
  .prizebtn{display:flex;gap:14px;align-items:center;text-align:left;padding:12px 16px;min-height:72px;width:100%;justify-content:flex-start}
  .prizebtn .pi{font-size:24px;width:46px;text-align:center;flex:none;letter-spacing:-.15em}
  .pi.gold5,.pi.gold10{color:var(--accent)}.pi.life{color:#e5534b}.pi.skill{color:#8ab4ff}
  .prizebtn .pt{display:flex;flex-direction:column}.prizebtn .pt b{font-size:16px}.prizebtn small{color:var(--dim)}
  .opts{display:flex;flex-direction:column;gap:10px;width:100%}.opts button{text-align:left;padding:10px 16px}.opts small{display:block;color:var(--dim)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
