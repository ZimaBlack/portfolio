name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dominio propio: definí las variables de repositorio SITE y BASE (BASE = /).
      # Si no existen, se usa https://<usuario>.github.io[/<repo>].
      SITE: ${{ vars.SITE || format('https://{0}.github.io', github.repository_owner) }}
      BASE: ${{ vars.BASE || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}', github.event.repository.name)) }}
      # Formulario "Saber más" (ver worker/README.md). Si están vacías, se abre WhatsApp con la pregunta.
      PUBLIC_QUESTION_ENDPOINT: ${{ vars.QUESTION_ENDPOINT }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
